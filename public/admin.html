<!-- admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Lena Dijksma</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#080808">
    <link rel="shortcut icon" href="/images/logo.png" type="image/png">
    <link rel="stylesheet" href="/vendor/ldcss/ldcss.min.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <script>
        (function(){var t=null;try{t=localStorage.getItem("ld-theme")}catch(e){}
        if(!t&&window.matchMedia("(prefers-color-scheme: dark)").matches)t="dark";
        if(t)document.documentElement.setAttribute("data-ld-theme",t)})();
    </script>
</head>

<body>
    <!-- LOGIN -->
    <main id="login-view" class="admin-login-view" hidden>
        <form id="login-form" class="ld-card admin-login-card">
            <img src="/images/logo.png" alt="" class="admin-logo" />
            <h1 class="ld-text-xl ld-mar-b-0">Admin</h1>
            <p class="ld-text-muted ld-text-sm">Enter the password to manage your projects.</p>

            <div class="ld-form-group ld-text-left">
                <label class="ld-label" for="password">Password</label>
                <input class="ld-input" type="password" id="password" name="password" autocomplete="current-password" required />
            </div>

            <button type="submit" class="ld-btn ld-w-full ld-justify-center" data-ld-variant="primary" id="login-btn">Sign in</button>
            <p id="login-error" class="ld-form-error" role="alert" hidden></p>
        </form>
    </main>

    <!-- DASHBOARD -->
    <div id="dashboard-view" hidden>
        <nav class="ld-nav" aria-label="Admin">
            <span class="ld-nav-brand" data-ld-mark="$">Projects admin</span>
            <div class="ld-row">
                <a href="/" class="ld-btn" data-ld-size="sm" data-ld-variant="ghost" target="_blank" rel="noopener noreferrer">View site ↗</a>
                <button class="ld-btn" data-ld-size="sm" data-ld-toggle="theme" aria-label="Toggle light/dark theme">theme</button>
                <button id="logout-btn" class="ld-btn" data-ld-size="sm" data-ld-variant="outline">Log out</button>
            </div>
        </nav>

        <main class="ld-container ld-container-sm admin-main">
            <div id="status-banner" class="admin-status-banner" role="status" hidden></div>

            <div id="projects-panel">
                <div class="ld-row ld-justify-between ld-mar-b-4">
                    <p class="ld-text-muted ld-mar-b-0" id="project-count">Loading projects…</p>
                    <button id="add-project-btn" class="ld-btn" data-ld-variant="primary">+ Add project</button>
                </div>
                <div id="projects-list" class="admin-projects-list"></div>
            </div>
        </main>
    </div>

    <!-- EDIT / ADD MODAL -->
    <div id="editor-overlay" class="admin-overlay" hidden>
        <form id="editor-form" class="ld-card admin-dialog">
            <h2 id="editor-title" class="ld-text-xl">Edit project</h2>

            <div class="admin-editor-grid">
                <div class="ld-form-group">
                    <label class="ld-label" for="f-title">Title (category)</label>
                    <input class="ld-input" type="text" id="f-title" required placeholder="e.g. Healthcare Website" />
                </div>
                <div class="ld-form-group">
                    <label class="ld-label" for="f-name">Name</label>
                    <input class="ld-input" type="text" id="f-name" required placeholder="e.g. NerineZorg" />
                </div>
            </div>

            <div class="ld-form-group">
                <label class="ld-label" for="f-desc">Description</label>
                <textarea class="ld-textarea" id="f-desc" rows="3" required></textarea>
            </div>

            <div class="admin-editor-grid">
                <div class="ld-form-group">
                    <label class="ld-label" for="f-link">Link</label>
                    <input class="ld-input" type="text" id="f-link" required placeholder="https://... or /netscan" />
                    <p class="ld-form-hint">For a generated page, use a path like <code class="ld-code-inline">/netscan</code> — that becomes the URL.</p>
                </div>
                <div class="ld-form-group">
                    <label class="ld-label" for="f-type">Type</label>
                    <input class="ld-input" type="text" id="f-type" required placeholder="e.g. website, personal" />
                </div>
            </div>

            <div class="admin-editor-grid">
                <div class="ld-form-group">
                    <label class="ld-label" for="f-color">Accent color</label>
                    <div class="admin-inline-row">
                        <input type="color" id="f-color-picker" value="#f5741e" aria-label="Pick accent color" />
                        <input class="ld-input" type="text" id="f-color" required placeholder="#f5741e" />
                    </div>
                </div>
                <div class="ld-form-group">
                    <label class="ld-label" for="f-img">Image path</label>
                    <div class="admin-inline-row">
                        <input class="ld-input" type="text" id="f-img" placeholder="/images/example.webp" />
                        <button type="button" class="ld-btn" id="f-img-upload-btn" title="Upload image">Upload</button>
                        <input type="file" id="f-img-file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml" hidden />
                    </div>
                    <p class="ld-form-hint" id="f-img-status"></p>
                </div>
            </div>

            <div class="ld-form-group">
                <label class="ld-label" for="f-tech">Tech (comma separated)</label>
                <input class="ld-input" type="text" id="f-tech" placeholder="HTML, CSS, JavaScript" />
            </div>

            <label class="ld-checkbox ld-mar-b-4">
                <input type="checkbox" id="f-public" />
                Public project (link opens externally, shown in the public grid)
            </label>

            <div class="ld-form-group" id="f-srclink-row">
                <label class="ld-label" for="f-srclink">Source code link</label>
                <input class="ld-input" type="text" id="f-srclink" placeholder="https://github.com/username/repo" />
                <p class="ld-form-hint">Private projects only — shown as a "Source" button.</p>
            </div>

            <label class="ld-checkbox ld-mar-b-4" id="f-generate-page-row">
                <input type="checkbox" id="f-generate-page" />
                Generate a project page at the link above (private projects only)
            </label>

            <div id="page-fields" class="admin-page-fields" hidden>
                <div class="admin-editor-grid">
                    <div class="ld-form-group">
                        <label class="ld-label" for="f-page-tag">Tag line</label>
                        <input class="ld-input" type="text" id="f-page-tag" placeholder="Private / Non-Commercial Project" />
                    </div>
                    <div class="ld-form-group">
                        <label class="ld-label" for="f-page-about-title">About section title</label>
                        <input class="ld-input" type="text" id="f-page-about-title" placeholder="Defaults to the project name" />
                    </div>
                </div>

                <div class="ld-form-group">
                    <label class="ld-label" for="f-page-hero-desc">Hero description</label>
                    <textarea class="ld-textarea" id="f-page-hero-desc" rows="2" placeholder="Defaults to the description above"></textarea>
                </div>

                <div class="ld-form-group">
                    <label class="ld-label" for="f-page-about">About section (blank line = new paragraph)</label>
                    <textarea class="ld-textarea" id="f-page-about" rows="6"></textarea>
                </div>

                <div class="admin-editor-grid">
                    <div class="ld-form-group">
                        <label class="ld-label" for="f-page-showcase-img">Showcase image path (optional)</label>
                        <div class="admin-inline-row">
                            <input class="ld-input" type="text" id="f-page-showcase-img" placeholder="/images/example-showcase.webp" />
                            <button type="button" class="ld-btn" id="f-page-showcase-img-upload-btn" title="Upload image">Upload</button>
                            <input type="file" id="f-page-showcase-img-file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml" hidden />
                        </div>
                        <p class="ld-form-hint" id="f-page-showcase-img-status"></p>
                    </div>
                    <div class="ld-form-group">
                        <label class="ld-label" for="f-page-showcase-caption">Showcase caption (optional)</label>
                        <input class="ld-input" type="text" id="f-page-showcase-caption" />
                    </div>
                </div>
            </div>

            <div class="ld-row ld-justify-end">
                <button type="button" id="editor-cancel" class="ld-btn">Cancel</button>
                <button type="submit" class="ld-btn" data-ld-variant="primary">Save project</button>
            </div>

            <p id="editor-error" class="ld-form-error" role="alert" hidden></p>
        </form>
    </div>

    <!-- CONFIRM MODAL (reused for delete + discard) -->
    <div id="confirm-overlay" class="admin-overlay" hidden>
        <div class="ld-card admin-dialog admin-confirm" role="alertdialog" aria-labelledby="confirm-title">
            <h2 id="confirm-title" class="ld-text-xl">Delete this project?</h2>
            <p class="ld-text-muted" id="confirm-text"></p>
            <div class="ld-row ld-justify-end">
                <button type="button" id="confirm-cancel" class="ld-btn">Cancel</button>
                <button type="button" id="confirm-ok" class="ld-btn" data-ld-variant="danger">Delete</button>
            </div>
        </div>
    </div>

    <script src="/vendor/ldcss/ldcss.min.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
